# A workspace file needs a packages list on pnpm 9 (Vercel). This repo is a single package.
packages:
  - '.'

# pnpm 10+ blocks dependency build scripts unless listed here.
allowBuilds:
  '@clerk/shared': false
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': false
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: false
